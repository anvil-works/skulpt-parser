# Parser inputs are fixtures; preserve their exact source text.
exclude: ^tests/corpus/
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.0.1
      hooks:
          - id: check-yaml
          - id: end-of-file-fixer
          - id: trailing-whitespace
    - repo: https://github.com/psf/black
      rev: 21.10b0 # Replace by any tag/version: https://github.com/psf/black/tags
      hooks:
          - id: black
            args: # arguments to configure black
                - --line-length=119
            language_version: python3 # Should be a command that runs python3.6+
    # flake8
    - repo: https://github.com/PyCQA/flake8
      rev: 4.0.1
      hooks:
          - id: flake8
    - repo: local
      hooks:
          - id: prettier
            name: Prettier
            entry: pnpm exec prettier --write
            language: system
            types_or: [javascript, jsx, ts, tsx, json, markdown, yaml]

    - repo: https://github.com/Lucas-C/pre-commit-hooks
      rev: v1.1.10
      hooks:
          - id: insert-license
            # These CPython-derived files carry their own combined SPDX header.
            exclude: ^src/(generated_parser\.ts|diagnostics\.ts|parser\.ts|imports\.ts|parameters\.ts|strings\.ts|string_names\.ts|lexer/tokenizer\.ts)$
            files: "^(src|scripts)/.*ts$"
            args:
                - --detect-license-in-X-top-lines=2
                - --comment-style
                - // # defaults to: #
