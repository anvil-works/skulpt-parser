name: baseline-tests
on:
    pull_request:
    push:
        branches: [master, next]
permissions:
    contents: read
jobs:
    baseline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.9.25"
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm build
            - run: pnpm test
              env:
                  PYTHON: python
            - run: pnpm test:package
            - run: pnpm build:expression
            - run: pnpm test:expression-package
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
            - run: pnpm test:python314-corpus
    upstream-inputs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
            - run: python -m unittest tools.upstream.test_inputs
            - run: python -m tools.upstream prepare
            - run: python -m tools.upstream check
            - run: python -m tools.generate314 --check
            - run: python -m tools.generate314 --parser --check
            - run: python -m tools.generate314.string_names
            - run: git diff --exit-code -- src/python314/string_names.json
            - run: python -m tools.generate314.lexer_tables
            - run: git diff --exit-code -- src/python314/lexer/unicode.json src/python314/lexer/operators.json
            - run: python tests/fixtures/generate_python314_ast.py
            - run: python tests/fixtures/generate_python314_numbers.py
            - run: python tests/fixtures/generate_python314_expressions.py
            - run: python tests/fixtures/generate_python314_modules.py
            - run: python tests/fixtures/generate_python314_diagnostics.py
            - run: python tests/fixtures/generate_python314_lexer.py
            - run: git diff --exit-code -- tests/fixtures/*.json
