name: baseline-tests
on:
    pull_request:
    push:
        branches: [master, next]
permissions:
    contents: read
jobs:
    baseline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: pnpm
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.9.25"
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm build
            - run: pnpm test
              env:
                  PYTHON: python
            - run: pnpm test:package
    upstream-inputs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.14.3"
            - run: python -m unittest tools.upstream.test_inputs
            - run: python -m tools.upstream prepare
            - run: python -m tools.upstream check
